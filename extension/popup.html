<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      background: #1f2937;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #111827;
    }
    button:disabled {
      background: #d1d5db;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    #status.success {
      background: #d1fae5;
      color: #065f46;
      display: block;
    }
    #status.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }
    #status.loading {
      background: #dbeafe;
      color: #1e40af;
      display: block;
    }
  </style>
</head>
<body>
  <button id="exportBtn">Export Liked Music</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
